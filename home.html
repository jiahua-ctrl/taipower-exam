<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爸爸的電力交易平台備考系統</title><link rel="stylesheet" href="accessibility.css"><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(160deg,#eef9f7,#f7fbff);color:#173b3d;font-size:19px;line-height:1.7}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(760px,100%);background:#fff;border:1px solid #dbe8e7;border-radius:24px;padding:34px;box-shadow:0 18px 50px rgba(12,70,73,.1)}.badge{display:inline-block;background:#e5f5f2;color:#0b5f63;padding:9px 14px;border-radius:999px;font-weight:800;font-size:16px}h1{font-size:clamp(34px,7vw,50px);line-height:1.2;margin:18px 0 12px}p{line-height:1.8;color:#607173}.today{background:#f1f8f7;border-radius:17px;padding:22px;margin:24px 0}.today h2{font-size:24px;margin:0 0 10px}.today strong{font-size:21px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{padding:16px;border:1px solid #dbe8e7;border-radius:14px;text-align:center}.stat b{display:block;font-size:30px;color:#0b5f63}.stat small{color:#708080;font-size:15px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions a{text-decoration:none;text-align:center;padding:18px 12px;border-radius:14px;background:#eaf3f2;color:#173b3d;font-weight:800;font-size:18px;line-height:1.5;min-height:58px;display:flex;align-items:center;justify-content:center}.actions a.primary{background:#0b5f63;color:#fff}.foot{font-size:15px;line-height:1.6;color:#718182;margin-top:22px}.font-tools{display:flex;justify-content:flex-end;margin-bottom:14px}@media(max-width:620px){body{font-size:18px}.wrap{padding:12px}.card{padding:24px 20px;border-radius:20px}.badge{font-size:15px}h1{font-size:clamp(32px,10vw,42px)}.stats{grid-template-columns:repeat(2,1fr)}.stat small{font-size:16px}.actions{grid-template-columns:1fr}.actions a{font-size:20px;min-height:64px}.today h2{font-size:23px}.today strong{font-size:20px}.foot{font-size:15px}}</style></head><body><main class="wrap"><section class="card"><div class="font-tools" data-accessibility-controls></div><span class="badge">⚡ 115年資格測驗備考</span><h1>爸爸的電力交易平台<br>備考系統</h1><p>每天不用先想要讀什麼。系統會先看「到期複習、錯題、今日進度」，再告訴你現在最值得做的事。</p><div class="stats"><div class="stat"><b id="days">--</b><small>距離筆試</small></div><div class="stat"><b id="todayCount">0</b><small>今日已做</small></div><div class="stat"><b id="dueCount">0</b><small>到期複習</small></div><div class="stat"><b id="wrongCount">0</b><small>錯題數</small></div></div><div class="today"><h2>🎯 今天建議</h2><strong id="advice">正在分析今天的學習任務…</strong><p id="detail">先完成最需要的複習，再進入新的題目。</p></div><div class="actions"><a class="primary" href="index.html?study=1">🚀 進入備考系統</a><a href="review.html">🧠 今日到期複習</a><a href="mock.html">⏱️ 正式模擬考</a></div><div class="foot">作答紀錄只儲存在這台裝置的瀏覽器｜非官方考古題</div></section></main><script src="accessibility.js"></script><script>(()=>{const now=new Date();const exam=new Date(2026,9,3);now.setHours(0,0,0,0);document.getElementById('days').textContent=Math.max(0,Math.ceil((exam-now)/86400000));function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}const wrong=load('taipower_exam_wrong_ids_v1',[]).length;document.getElementById('wrongCount').textContent=wrong;const review=load('taipower_exam_spaced_review_v1',{});const due=Object.values(review).filter(x=>x&&x.due&&new Date(x.due)<=new Date()).length;document.getElementById('dueCount').textContent=due;const stats=load('taipower_exam_stats_v1',{});let today=0;const todayKey=new Date().toDateString();Object.values(stats).forEach(x=>{if(x&&x.last&&new Date(x.last).toDateString()===todayKey)today+=(x.attemptsToday||1)});document.getElementById('todayCount').textContent=today;const a=document.getElementById('advice'),d=document.getElementById('detail');if(due>0){a.textContent='🧠 先完成 '+due+' 題到期複習';d.textContent='這些題目正好到了最值得重新想一次的時間，完成後再刷新題。'}else if(wrong>0){a.textContent='❌ 先回收錯題本的 '+wrong+' 題';d.textContent='今天先把曾經答錯的題目重新做對，再增加新的題量。'}else if(today<20){a.textContent='📝 今天再完成 '+(20-today)+' 題';d.textContent='先把每日基本量補滿，系統會持續累積弱點與記憶排程。'}else{a.textContent='🎉 今日基本量完成';d.textContent='今天已達20題。可以做計算題、弱點單元，或先休息，明天再繼續。'}})();</script></body></html>
