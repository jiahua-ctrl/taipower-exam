<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爸爸的電力交易平台備考系統</title><style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(160deg,#eef9f7,#f7fbff);color:#173b3d}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(720px,100%);background:#fff;border:1px solid #dbe8e7;border-radius:24px;padding:32px;box-shadow:0 18px 50px rgba(12,70,73,.1)}.badge{display:inline-block;background:#e5f5f2;color:#0b5f63;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}h1{font-size:clamp(30px,7vw,48px);line-height:1.15;margin:16px 0 10px}p{line-height:1.75;color:#607173}.today{background:#f1f8f7;border-radius:17px;padding:18px;margin:22px 0}.today h2{font-size:19px;margin:0 0 8px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions a{text-decoration:none;text-align:center;padding:15px 10px;border-radius:14px;background:#eaf3f2;color:#173b3d;font-weight:800}.actions a.primary{background:#0b5f63;color:#fff}.foot{font-size:12px;color:#899;margin-top:20px}@media(max-width:620px){.card{padding:24px}.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><span class="badge">⚡ 115年資格測驗備考</span><h1>爸爸的電力交易平台<br>備考系統</h1><p>每天不用先想要讀什麼。從今日任務、到期複習或正式模擬開始，把錯題慢慢變成熟悉的得分題。</p><div class="today"><h2>🎯 今天建議</h2><strong id="advice">正在分析今天的學習任務…</strong><p id="detail">先完成最需要的複習，再進入新的題目。</p></div><div class="actions"><a class="primary" href="index.html?study=1">🚀 進入備考系統</a><a href="review.html">🧠 今日到期複習</a><a href="mock.html">⏱️ 正式模擬考</a></div><div class="foot">作答紀錄只儲存在這台裝置的瀏覽器｜非官方考古題</div></section></main><script>try{const wrong=JSON.parse(localStorage.getItem('taipower_exam_wrong_ids_v1')||'[]').length;if(wrong){document.getElementById('advice').textContent='❌ 錯題本還有 '+wrong+' 題';document.getElementById('detail').textContent='今天先回收幾題錯題，再進行新的練習。'}else{document.getElementById('advice').textContent='📝 今天先完成 20 題';document.getElementById('detail').textContent='完成後再依弱點與記憶狀態安排下一輪。'}}catch(e){document.getElementById('advice').textContent='📝 今天先完成 20 題'}</script></body></html>
