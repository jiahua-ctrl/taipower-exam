name: Audit Question Bank

on:
  push:
    branches: [main]
    paths:
      - 'questions_*.js'
      - 'question_bank_guard.js'
      - 'config.js'
      - 'unit_filter.js'
      - 'strict_filter.js'
      - 'RULE_AUDIT_115.md'
      - 'scripts/audit_question_bank_v3.js'
      - 'scripts/audit_market_rules_115.js'
      - 'scripts/audit_unit9_deadlines.js'
      - 'scripts/audit_unit9_bidding.js'
      - '.github/workflows/audit-question-bank.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit 800-question bank
        run: node scripts/audit_question_bank_v3.js
      - name: Audit 115 market-rule constants
        run: node scripts/audit_market_rules_115.js
      - name: Audit Unit 9 deadlines
        run: node scripts/audit_unit9_deadlines.js
      - name: Audit Unit 9 bidding
        run: node scripts/audit_unit9_bidding.js
