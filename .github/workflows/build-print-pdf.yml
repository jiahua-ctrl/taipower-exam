name: Build printable question bank PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'questions_verified_core_v1.js'
      - 'questions_confusion_v3.js'
      - 'questions_verified_high_discrimination_v*.js'
      - 'questions_advanced_v2_500.js'
      - 'questions_advanced_v*_patch.js'
      - 'question_bank_guard.js'
      - 'scripts/export_question_bank_800.js'
      - 'scripts/build_print_pdf_v2.py'
      - 'scripts/build_print_pdf_compact.py'
      - '.github/workflows/build-print-pdf.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export the same verified 800-question bank used by the website
        run: |
          node scripts/export_question_bank_800.js
          test -s dist/question_bank_800.json
          test -s dist/question_bank_800_audit.json
          cat dist/question_bank_800_audit.json

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pymupdf
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk poppler-utils

      - name: Build draft DOCX with reserved TOC page
        run: python scripts/build_print_pdf_compact.py --draft

      - name: Render draft PDF for page-number detection
        run: |
          mkdir -p dist/draft_pdf
          libreoffice --headless --convert-to pdf --outdir dist/draft_pdf dist/taipower_exam_800q_A4_14pt_draft.docx
          test -s dist/draft_pdf/taipower_exam_800q_A4_14pt_draft.pdf

      - name: Build final DOCX with real TOC page numbers
        run: |
          python scripts/build_print_pdf_compact.py --final --draft-pdf dist/draft_pdf/taipower_exam_800q_A4_14pt_draft.pdf

      - name: Convert final DOCX to PDF
        run: |
          mkdir -p dist/pdf
          libreoffice --headless --convert-to pdf --outdir dist/pdf dist/taipower_exam_800q_A4_14pt.docx
          test -s dist/pdf/taipower_exam_800q_A4_14pt.pdf
          pdfinfo dist/pdf/taipower_exam_800q_A4_14pt.pdf | head -20

      - name: Verify final PDF and TOC page map
        run: |
          python scripts/build_print_pdf_compact.py --verify --pdf dist/pdf/taipower_exam_800q_A4_14pt.pdf

      - name: Upload printable PDF
        uses: actions/upload-artifact@v4
        with:
          name: taipower-printable-question-bank-800q-14pt
          path: dist/pdf/taipower_exam_800q_A4_14pt.pdf
          if-no-files-found: error
          retention-days: 30
