name: Build printable question bank PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'questions_verified_core_v1.js'
      - 'questions_confusion_v3.js'
      - 'questions_verified_high_discrimination_v*.js'
      - 'scripts/build_print_pdf_v2.py'
      - 'scripts/build_print_pdf_final.py'
      - '.github/workflows/build-print-pdf.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk poppler-utils

      - name: Build A4 16pt DOCX
        run: python scripts/build_print_pdf_final.py

      - name: Convert to PDF
        run: |
          mkdir -p dist/pdf
          libreoffice --headless --convert-to pdf --outdir dist/pdf dist/taipower_exam_300q_A4_16pt.docx
          test -s dist/pdf/taipower_exam_300q_A4_16pt.pdf
          pdfinfo dist/pdf/taipower_exam_300q_A4_16pt.pdf | head -20

      - name: Upload printable PDF
        uses: actions/upload-artifact@v4
        with:
          name: taipower-printable-question-bank
          path: dist/pdf/taipower_exam_300q_A4_16pt.pdf
          if-no-files-found: error
          retention-days: 30
